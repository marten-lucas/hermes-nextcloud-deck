# Hinweis (ARCH-002): Der Laufzeit-Plattform-Key ist `deck`
# (register_platform(name="deck") in adapter.py), NICHT der Manifest-Name
# `nextcloud-deck-platform` darunter. Das ist die dokumentierte
# Hermes-Plattform-Plugin-Konvention (Kürzel = Plattform-Key, `<kürzel>-platform`
# = Manifest-Name — vgl. hermes-agent „Adding Platform Adapters“:
# register_platform(name="myplatform") + Manifest `name: myplatform-platform`).
# Die beiden sind also intentional unterschiedlich und dürfen nicht
# "vereinheitlicht" werden (würde das Laufzeit-Verhalten brechen).
name: nextcloud-deck-platform
label: Nextcloud Deck
kind: platform
version: 0.5.0
description: >
  Nextcloud Deck platform adapter for Hermes Agent with agentic Kanban workflow,
  plan/execute phases, human-in-the-loop gates, subtask tracking and metadata actions.
author: Local Development
entrypoint: adapter.py
provides_hooks:
  - pre_tool_call
provides_tools:
  - deck_card_action
requires_env:
  - name: NEXTCLOUD_DECK_BASE_URL
    description: "Base URL of the Nextcloud instance"
    prompt: "Nextcloud base URL"
    password: false
  - name: NEXTCLOUD_DECK_USERNAME
    description: "Nextcloud username used by the adapter"
    prompt: "Nextcloud username"
    password: false
  - name: NEXTCLOUD_DECK_APP_PASSWORD
    description: "Nextcloud app password"
    prompt: "Nextcloud app password"
    password: true
optional_env:
  - name: NEXTCLOUD_DECK_HERMES_USER_ID
    description: "Nextcloud user ID assigned to Hermes"
    prompt: "Hermes Nextcloud user ID"
    password: false
  - name: NEXTCLOUD_DECK_POLL_INTERVAL_SECONDS
    description: "Polling interval in seconds (minimum 5)"
    prompt: "Polling interval"
    password: false
  - name: NEXTCLOUD_DECK_BACKLOG_FORMAT_QUIET_SECONDS
    description: "Quiet window (seconds) for Backlog format correction; 0 disables (default 300)"
    prompt: "Backlog format quiet window"
    password: false
  - name: NEXTCLOUD_DECK_MAX_IN_PROGRESS
    description: "Max concurrent cards in work (todo/ready/running); 0 = unlimited (default)"
    prompt: "Work-in-progress limit"
    password: false
  - name: NEXTCLOUD_DECK_TEMPLATE_LANGUAGE
    description: "Template language (de or en, default de)"
    prompt: "Template language"
    password: false
  - name: NEXTCLOUD_DECK_SPEED_ENABLED
    description: "Show live token-generation speed (t/s) in the user status via the Ollama sidecar (default false)"
    prompt: "Enable live token speed in status"
    password: false
  - name: NEXTCLOUD_DECK_SPEED_URL
    description: "URL of the Ollama speed sidecar endpoint (e.g. https://ollama.cloud.kiga-gramschatz.de/speed)"
    prompt: "Ollama speed sidecar URL"
    password: false
  - name: NEXTCLOUD_DECK_AUTO_RESUME
    description: "Auto-resume interrupted work after gateway restart and during idle (running cards + newly approved review cards); default true"
    prompt: "Enable auto-resume"
    password: false
  - name: NEXTCLOUD_DECK_MAX_AUTO_RESUMES_PER_CARD
    description: "Max auto-resume runs per card per work cycle (loop protection); 0 = auto-resume off (default 3)"
    prompt: "Max auto-resumes per card"
    password: false