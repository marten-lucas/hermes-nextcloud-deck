name: nextcloud-deck-platform
label: Nextcloud Deck
kind: platform
version: 0.2.1
description: >
  Nextcloud Deck platform adapter for Hermes Agent.
  Monitors Deck boards, stacks, and cards; extracts work items, tasks, and comments;
  propagates identity (assignee vs. commenter) and synchronizes status updates.
author: Local Development
provides_skills:
  - nextcloud-collaboration
requires_env:
  - name: NEXTCLOUD_DECK_BASE_URL
    description: "Base URL of Nextcloud instance (e.g. https://cloud.example.org)"
    prompt: "Nextcloud base URL"
    password: false
  - name: NEXTCLOUD_DECK_USERNAME
    description: "Nextcloud Deck account username"
    prompt: "Nextcloud Deck username"
    password: false
  - name: NEXTCLOUD_DECK_APP_PASSWORD
    description: "App password for Nextcloud Deck"
    prompt: "Nextcloud Deck app password"
    password: true
optional_env:
  - name: NEXTCLOUD_DECK_HERMES_USER_ID
    description: "User ID of the Hermes Bot in Nextcloud (defaults to username)"
    prompt: "Hermes Bot User ID"
    password: false
  - name: NEXTCLOUD_DECK_POLL_INTERVAL
    description: "Polling interval for card updates in seconds (default: 5)"
    prompt: "Polling interval"
    password: false