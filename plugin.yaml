name: nextcloud-deck-platform
label: Nextcloud Deck
kind: platform
version: 0.3.0
description: >
  Nextcloud Deck platform adapter for Hermes Agent. Polls explicitly configured
  boards, only ingests cards assigned to the configured Hermes user, and writes
  Hermes responses back as Deck comments.
author: Local Development
requires_env:
  - name: NEXTCLOUD_DECK_BASE_URL
    description: "Base URL of the Nextcloud instance"
    prompt: "Nextcloud base URL"
    password: false
  - name: NEXTCLOUD_DECK_USERNAME
    description: "Nextcloud username used by the adapter"
    prompt: "Nextcloud username"
    password: false
  - name: NEXTCLOUD_DECK_APP_PASSWORD
    description: "Nextcloud app password"
    prompt: "Nextcloud app password"
    password: true
optional_env:
  - name: NEXTCLOUD_DECK_HERMES_USER_ID
    description: "Nextcloud user ID assigned to Hermes"
    prompt: "Hermes Nextcloud user ID"
    password: false
  - name: NEXTCLOUD_DECK_POLL_INTERVAL_SECONDS
    description: "Polling interval in seconds (minimum 5)"
    prompt: "Polling interval"
    password: false
